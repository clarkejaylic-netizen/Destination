<body>
    <div class="container">
        <div class="login-box">
            <h2>Login</h2>
            <form action="#">
                <div class="input-box">
                    <input type="text" name="username" required="">

                </div>
                <div class="input-box">
                    <input type="password" name="password" required="">

                </div>

                <div class="logreg-link">
                    <p>Don't have an account? <a href="#">Register</a></p>
                </div>
            </form>
        </div>
    </div>
</body>
